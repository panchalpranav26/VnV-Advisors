<!doctype html>
<html lang="en">
<head>
    <!-- Basic Page Setup -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Title will be injected dynamically by SEO Auto Loader -->
    <title>Loading...</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/pages/contact_consult.css" />

    <!-- Dynamic SEO Loader (replaces ALL static meta/og/twitter/jsonld tags) -->
    <script type="module" src="/assets/js/seo_json_build/auto_seo_loader.js"></script>
</head>


<body>

<!-- Header / Navigation -->

<div id="site-header"></div>
<!-- Main Content -->
<main class="wrap">
    <header class="page-hero reveal">
        <h1 class="page-title">Contact Us</h1>
        <p class="lead">
            We're here to support your journey toward financial confidence, family protection, and long-term wealth-building.
            Fill out the form below, and our team will reach out shortly.
        </p>
    </header>
    <div class="form-glass">
        <form id="contact-form">
            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required />
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone (Optional)</label>
                <input type="tel" id="phone" name="phone" />
            </div>

            <div class="form-group">
                <label for="topic">Topic <span class="required">*</span></label>
                <select id="topic" name="topic" required>
                    <option value="---">Select a topic</option>
                    <option value="Book a Consultation">Book a Consultation</option>
                    <option value="Life Insurance Guidance">Life Insurance Guidance</option>
                    <option value="Financial Education Inquiry">Financial Education Inquiry</option>
                    <option value="Other Inquiry">Other Inquiry</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <div id="form-status" class="form-status" aria-live="polite"></div>

            <button type="submit" class="btn-glow lg">Send Message</button>
        </form>

        <p class="privacy-note">
            Your information is kept private and will only be used to respond to your request.
        </p>
    </div>

</main>

<!-- Footer -->
<div id="site-footer"></div>

<script type="module" src="/assets/js/auto_page_id.js" defer></script>
<script type="module" src="/assets/js/taxonomy/taxonomy_manager.js" defer></script>
<script type="module" src="/assets/js/taxonomy/taxonomy_loader.js" defer></script>
<script type="module" src="/assets/js/taxonomy/page_metadata.js" defer></script>
<script src="/assets/js/resource_core.js" defer></script>
<script type="module" src="/assets/js/core.js" defer></script>
<script type="module" src="/assets/js/pages/financial_ed.js" defer></script>

<script type="module">
    import { initContactForm } from "../assets/js/pages/contact_consult.js";
    window.addEventListener("DOMContentLoaded", initContactForm);
</script>

</body>
</html>
